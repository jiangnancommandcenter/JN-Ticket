<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jiangnan CCTV Command Center">
  <!-- Brand green (#72bf6a = --color-primary) rounded app tile -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <!-- Camera body -->
  <rect x="12" y="20" width="40" height="26" rx="5" fill="#72bf6a"/>
  <!-- Lens -->
  <circle cx="32" cy="33" r="7.5" fill="#0F172A"/>
  <circle cx="32" cy="33" r="3.5" fill="#F8FAFC"/>
  <!-- Recording dot, in the "offline" red already used by --color-danger -->
  <circle cx="45" cy="26" r="2.5" fill="#dc2626"/>
  <!-- Mount -->
  <path d="M26 46v5h12v-5" fill="#72bf6a" opacity="0.65"/>
</svg>
