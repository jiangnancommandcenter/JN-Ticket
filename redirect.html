<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://jiangnancommandcenter.github.io/JNTicket/main.html">
    <title>Redirecting to JNTicket…</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 40px 32px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #334155;
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 1.25rem; margin-bottom: 8px; font-weight: 600; }
        p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px; }
        a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #34d399;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }
        a:hover { text-decoration: underline; color: #6ee7b7; }
        a i { font-size: 1rem; }
        .url {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #64748b;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Redirecting…</h1>
        <p>Opening JNTicket dashboard. If nothing happens, click the link below.</p>
        <a href="https://jiangnancommandcenter.github.io/JNTicket/main.html" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-external-link-alt" aria-hidden="true"></i>
            Open main.html
        </a>
        <div class="url">https://jiangnancommandcenter.github.io/JNTicket/main.html</div>
    </div>

    <script>
        // Instant redirect without adding this page to browser history,
        // so the Back button on the destination won't bounce back here.
        (function () {
            var target = 'https://jiangnancommandcenter.github.io/JNTicket/main.html';
            try {
                window.location.replace(target);
            } catch (e) {
                window.location.href = target;
            }
        })();
    </script>
</body>
</html>
